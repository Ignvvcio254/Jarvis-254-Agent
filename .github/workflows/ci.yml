name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests — Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install pytest

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Node tests (gateway multi-modelo + harness guard)
        run: node --test hooks/harness_guard.test.mjs models/anthropic-openai.test.mjs models/modelo-proxy.test.mjs

      - name: Doctor check (repo-only)
        run: python jarvis_doctor.py --repo-only
